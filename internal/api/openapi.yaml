openapi: 3.1.0
info:
  title: Kinara Server API
  version: 0.1.0
  description: |
    JSON API used by the Kinara apps. Sign in with POST /auth/login and send
    the returned token as `Authorization: Bearer <token>` on every request.
    Stream and image URLs also accept `?token=<token>` so plain players such
    as VLC can open them.
servers:
  - url: /api/v1
security:
  - bearer: []

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
    DownloadSettings:
      type: object
      properties:
        enabled: { type: boolean, description: Apps can download titles to watch offline (default on) }
        maxGB: { type: integer, description: Room prepared copies may take on the server (default 100) }
        perUser: { type: integer, description: Downloads each account can have, 0 for no limit (default 200) }
    Download:
      type: object
      properties:
        id: { type: integer }
        itemId: { type: string }
        versionId: { type: string }
        quality: { type: string, enum: [original, high, medium, low] }
        state:
          type: string
          enum: [queued, preparing, ready, failed, expired]
          description: expired means the prepared copy was removed to save room; fetching it prepares it again
        progress: { type: number, description: Share prepared, 0 to 1 }
        place: { type: integer, description: Copies ahead of this one in line (queued only) }
        size: { type: integer, description: Bytes, once ready }
        estimate: { type: integer, description: Expected bytes }
        error: { type: string }
        fileUrl: { type: string, description: 'Where to fetch it once ready (byte ranges; takes ?token=)' }
        deviceId: { type: string }
        deviceName: { type: string }
        thisDevice: { type: boolean, description: Made on the device asking }
        username: { type: string, description: Whose it is (owner's list only) }
        createdAt: { type: integer }
        readyAt: { type: integer }
        savedAt: { type: integer, description: When the device said it has all of it }
        item: { $ref: "#/components/schemas/Item" }
        showTitle: { type: string }
        showId: { type: string }
    BackupSettings:
      type: object
      properties:
        auto: { type: boolean, description: A backup every night at about 3:30 (default on) }
        keep: { type: integer, description: How many nightly and manual backups to keep (default 7) }
        dir: { type: string, description: 'The backups folder, a full path on the server ("" for backups in the data folder)' }
    Backup:
      type: object
      properties:
        name: { type: string }
        size: { type: integer }
        version: { type: string, description: The Kinara version that made it }
        schema: { type: integer }
        createdAt: { type: integer }
        host: { type: string, description: The computer it was made on }
        reason: { type: string, enum: [scheduled, manual, before-restore, before-update] }
        counts:
          type: object
          properties:
            users: { type: integer }
            libraries: { type: integer }
            titles: { type: integer }
            watched: { type: integer }
        files: { type: array, items: { type: string } }
    ExternalSubtitle:
      type: object
      properties:
        index: { type: integer, description: "1000000 and up: use it where a track index goes (/subtitles/{versionId}/{index}.vtt)" }
        language: { type: string, description: ISO 639-2, like the file's tracks }
        title: { type: string, description: What else the file name says, or the release a download was timed for }
        format: { type: string, enum: [subrip, ass, ssa, webvtt] }
        forced: { type: boolean }
        hearingImpaired: { type: boolean }
        source: { type: string, enum: [sidecar, download] }
        url: { type: string, description: The WebVTT }
        removable: { type: boolean, description: A download this account may delete }
    SubtitleResult:
      type: object
      properties:
        fileId: { type: integer }
        language: { type: string }
        release: { type: string }
        fileName: { type: string }
        downloads: { type: integer }
        rating: { type: number }
        hearingImpaired: { type: boolean }
        forced: { type: boolean }
        ai: { type: boolean, description: An AI translation }
        machine: { type: boolean, description: A machine translation }
        trusted: { type: boolean }
        fps: { type: number }
        hashMatch: { type: boolean, description: Made for this exact file, so the timing fits }
        uploader: { type: string }
    UpdateStatus:
      type: object
      properties:
        current: { type: string, description: This server's version }
        latest: { type: string, description: The newest release (once checked) }
        available: { type: boolean, description: latest is newer than current }
        date: { type: string, description: When latest came out (YYYY-MM-DD) }
        notes: { type: string, description: Link to what's new }
        checkedAt: { type: integer, description: Unix seconds of the last check that answered (0 never) }
        error: { type: string, description: Why the last check failed }
        kind: { type: string, enum: [windows, macos, deb, docker, other], description: How this copy was installed }
        canInstall: { type: boolean, description: Kinara can install the update itself (Windows and macOS installs) }
        how: { type: string, description: "What to do when it can't: the apt or docker command, or where to download" }
        state: { type: string, enum: [idle, downloading, verifying, installing, failed] }
        message: { type: string, description: Why an install failed }
        downloaded: { type: integer, description: Bytes so far, while downloading }
        size: { type: integer, description: The installer's size }
    DeviceInfo:
      type: object
      description: >
        Optional on sign-in (login, signup, cloud). Describes the app install so
        the owner sees what the device is and can trust it. Keep `id` the same
        for the life of the install: signing in again keeps the device's name
        and trust. Unknown fields are ignored. `deviceName` is still accepted
        and wins over `name`.
      properties:
        id: { type: string, description: "8 to 64 of A-Z a-z 0-9 - _, made by the app on install" }
        name: { type: string, example: "Mridul's Z Fold 6" }
        platform: { type: string, enum: [android, android-tv, ios, tvos, roku, web] }
        brand: { type: string, example: samsung }
        model: { type: string, example: SM-F956U1, description: 'The web app sends "Chrome on Windows" and the like' }
        os: { type: string, example: Android 15 }
        app: { type: string, example: Kinara 0.9.4 }
        formFactor: { type: string, enum: [tablet], description: Send "tablet" on tablets }
    DeviceItem:
      type: object
      properties:
        id: { type: string, description: "The session's device ID (sign out with DELETE /devices/{id})" }
        name: { type: string }
        userId: { type: integer }
        username: { type: string }
        createdAt: { type: integer }
        lastSeenAt: { type: integer }
        current: { type: boolean }
        nodeId: { type: string }
        clientId: { type: string, description: 'The app install; "s-" plus the session ID for apps that sent none' }
        platform: { type: string }
        brand: { type: string }
        model: { type: string }
        os: { type: string }
        app: { type: string }
        icon:
          type: string
          enum: [roku, shield, google-tv, fire-tv, android-tv, apple-tv, tv, iphone, ipad, android-phone,
            android-tablet, web-chrome, web-firefox, web-safari, web-edge, web]
        trusted: { type: boolean, description: Requests from this device are approved straight away }
        label: { type: string, example: "Roku · TCL 55S455" }
    Request:
      type: object
      properties:
        id: { type: integer }
        kind: { type: string, enum: [movie, show] }
        tmdbId: { type: integer }
        title: { type: string }
        year: { type: integer }
        posterUrl: { type: string }
        mode: { type: string, enum: [all, seasons, pilot] }
        seasons: { type: array, items: { type: integer } }
        status: { type: string, enum: [pending, approved, declined, available] }
        auto: { type: boolean, description: Approved straight away (trusted device) }
        note: { type: string }
        declineReason: { type: string }
        requestedBy: { type: object, properties: { id: { type: integer }, name: { type: string } } }
        device: { type: object, properties: { id: { type: string }, name: { type: string }, icon: { type: string } } }
        createdAt: { type: integer }
        decidedAt: { type: integer }
    RequestMarker:
      type: object
      description: On titles outside the library when there is a pending or approved request for them
      properties:
        id: { type: integer }
        status: { type: string, enum: [pending, approved] }
        mine: { type: boolean }
        mode: { type: string }
        seasons: { type: array, items: { type: integer } }
    TitleItem:
      type: object
      description: A TMDB title (trending, discover, search)
      properties:
        tmdbId: { type: integer }
        kind: { type: string, enum: [movie, show] }
        title: { type: string }
        year: { type: integer }
        overview: { type: string }
        rating: { type: number }
        genres: { type: array, items: { type: string } }
        posterUrl: { type: string }
        backdropUrl: { type: string }
        item: { type: object, description: The library's copy, when there is one }
        request: { $ref: "#/components/schemas/RequestMarker" }
        rank: { type: integer, description: Place in a trending list }
    TitlePage:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/TitleItem" } }
        page: { type: integer }
        totalPages: { type: integer }
    User:
      type: object
      properties:
        id: { type: integer }
        username: { type: string }
        isAdmin: { type: boolean }
        createdAt: { type: integer, description: Unix seconds }
    WatchState:
      type: object
      properties:
        itemId: { type: string }
        positionSec: { type: number }
        completed: { type: boolean }
        playCount: { type: integer }
        lastPlayedAt: { type: integer }
    Item:
      type: object
      properties:
        id: { type: string }
        libraryId: { type: integer }
        kind: { type: string, enum: [movie, show, season, episode] }
        parentId: { type: string }
        title: { type: string }
        sortTitle: { type: string }
        year: { type: integer }
        seasonNumber: { type: integer, description: -1 when not a season or episode }
        episodeNumber: { type: integer, description: -1 when not an episode }
        overview: { type: string }
        rating: { type: number, description: TMDB average, 0 to 10 }
        runtimeMin: { type: integer }
        airDate: { type: string }
        matchState: { type: string, enum: [pending, matched, unmatched, manual] }
        matchConfidence: { type: number }
        addedAt: { type: integer }
        updatedAt: { type: integer }
        posterUrl: { type: string, description: "Add ?w=<width> for a resized copy" }
        backdropUrl: { type: string }
        watch: { $ref: "#/components/schemas/WatchState" }
    Stream:
      type: object
      properties:
        index: { type: integer }
        type: { type: string, enum: [video, audio, subtitle] }
        codec: { type: string }
        profile: { type: string }
        language: { type: string }
        title: { type: string }
        channels: { type: integer }
        default: { type: boolean }
        forced: { type: boolean }
    Version:
      type: object
      properties:
        id: { type: string }
        itemId: { type: string }
        relPath: { type: string }
        part: { type: integer }
        size: { type: integer }
        container: { type: string }
        durationSec: { type: number }
        bitrate: { type: integer }
        width: { type: integer }
        height: { type: integer }
        videoCodec: { type: string }
        hdr: { type: string, enum: ["", hdr10, hlg, dolby_vision] }
        dvProfile: { type: integer }
        streams:
          type: array
          items: { $ref: "#/components/schemas/Stream" }
        subtitles:
          type: array
          description: |
            Subtitle files outside the video (next to it, or downloaded from
            OpenSubtitles). Not in streams, whose order matches the player's
            tracks. Fetch one as WebVTT from its url, like a text track.
          items: { $ref: "#/components/schemas/ExternalSubtitle" }
        streamUrl: { type: string }
        transcodeUrl: { type: string, description: Converts the file (when the server has ffmpeg) }
        trickplayUrl: { type: string, description: Preview thumbnails (once made) }
        intro:
          type: object
          description: Where the opening titles are, when found
          properties: { start: { type: number }, end: { type: number } }
        endCredits:
          type: object
          description: Where the end credits are, when found (players offer the next episode from start)
          properties:
            start: { type: number }
            end: { type: number }
            source: { type: string, enum: [audio, picture], description: How they were found }
    Library:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        path: { type: string, description: The first folder }
        folders:
          type: array
          description: Every folder in the library, oldest first
          items: { type: string }
        kind: { type: string, enum: [movies, tv, other] }
        lastScanAt: { type: integer }
        stats:
          type: object
          properties:
            movies: { type: integer }
            shows: { type: integer }
            episodes: { type: integer }
            unmatched: { type: integer }
            pending: { type: integer }
            files: { type: integer }
            missing: { type: integer }
            probeErrors: { type: integer }
        scan:
          type: object
          description: Present after a scan has run since the server started.
          properties:
            running: { type: boolean }
            phase: { type: string, enum: [walking, matching, done, failed] }
            filesSeen: { type: integer }
            new: { type: integer }
            changed: { type: integer }
            message: { type: string }
    Profile:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        color: { type: string, example: "#F2B33D" }
        hasPin: { type: boolean }
        kids: { type: boolean }
        audioLang: { type: string, description: "ISO 639-2 code such as eng; empty = file default" }
        subtitleLang: { type: string }
        subtitleMode: { type: string, enum: [off, forced, always] }
    TrackPrefs:
      type: object
      description: A profile's choices for a show or movie, merged over the profile's defaults.
      properties:
        audioLang: { type: string }
        subtitleLang: { type: string }
        subtitleMode: { type: string, enum: ["", off, forced, always] }
    CastMember:
      type: object
      properties:
        order: { type: integer }
        name: { type: string }
        role: { type: string }
        photoUrl: { type: string, description: "Add ?w=<width>" }
    NextUp:
      type: object
      properties:
        episode: { $ref: "#/components/schemas/Item" }
        inProgress: { type: boolean }
        reason: { type: string, example: "You finished S02E04 yesterday" }
        gaps:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              season: { type: integer }
              episode: { type: integer }

paths:
  /health:
    get:
      summary: Server status (no sign-in needed)
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  product: { type: string, description: 'Always "kinara", so apps scanning the network can recognise the server' }
                  name: { type: string, description: The computer's name }
                  version: { type: string }
                  setupDone: { type: boolean }
                  metadata: { type: boolean, description: Whether a TMDB key is set }
                  update: { type: string, description: "A newer version that's out, when there is one. Only on the server's own network (the tray and the menu bar item read it)." }

  /auth/login:
    post:
      summary: Sign in a device
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
                deviceName: { type: string, example: Living room Shield }
                device: { $ref: "#/components/schemas/DeviceInfo" }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user: { $ref: "#/components/schemas/User" }
                  profiles:
                    type: array
                    description: Show "Who's watching?" when there is more than one
                    items: { $ref: "#/components/schemas/Profile" }
        "401": { description: Wrong username or password }
        "429": { description: Too many failed attempts }

  /auth/logout:
    post:
      summary: Sign this device out
      responses:
        "204": { description: Signed out }

  /me:
    get:
      summary: The signed-in user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }

  /libraries:
    get:
      summary: Libraries with counts and scan status
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Library" }
    post:
      summary: Add a library and start its first scan (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, kind]
              properties:
                name: { type: string }
                path: { type: string, description: Absolute folder path on the server }
                kind: { type: string, enum: [movies, tv, other] }
      responses:
        "201": { description: Created }
        "400": { description: Invalid folder or kind, or the folder overlaps one a library has }

  /libraries/{id}:
    patch:
      summary: Rename a library (admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 80 }
      responses:
        "200":
          description: The library
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Library" }
        "400": { description: Empty or too long name }
        "404": { description: No such library }
    delete:
      summary: Remove a library (admin). Files are not touched.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Removed }

  /libraries/{id}/folders:
    post:
      summary: Add a folder to a library and scan it (admin)
      description: >
        The folder can't be one a library already has, or sit inside or around
        one. If a scan is running, another runs when it ends.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: { type: string, description: Absolute folder path on the server }
      responses:
        "201":
          description: The library
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Library" }
        "400": { description: Invalid or overlapping folder }
        "404": { description: No such library }
    delete:
      summary: Take a folder out of a library (admin)
      description: >
        Kinara forgets the files in it; nothing on disk is touched. Titles left
        with no files are removed unless someone has watched them. A library's
        only folder can't be removed: remove the library instead.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: path, in: query, required: true, schema: { type: string }, description: The folder exactly as the library lists it }
      responses:
        "200":
          description: The library, plus how many file records were dropped
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Library" }
                  - type: object
                    properties:
                      removedFiles: { type: integer }
        "400": { description: That is the library's only folder }
        "404": { description: The folder isn't part of this library }
        "409": { description: A scan is running }

  /subtitles/{versionId}/search:
    get:
      summary: Search OpenSubtitles for a movie's or episode's subtitles
      description: |
        By the title's TMDB ID (an episode's show, season and episode) and
        the file's OpenSubtitles hash; best first (made for this file, by a
        person, most downloaded). Owners can turn this off for other accounts.
      parameters:
        - { name: versionId, in: path, required: true, schema: { type: string } }
        - { name: languages, in: query, schema: { type: string }, description: "Comma separated (en, eng or English); default en" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  results: { type: array, items: { $ref: "#/components/schemas/SubtitleResult" } }
        "403": { description: The owner turned subtitle downloads off for other accounts }
        "501": { description: No OpenSubtitles API key on this server }

  /subtitles/{versionId}/download:
    post:
      summary: Download a search result and keep it with the file, for everyone
      parameters:
        - { name: versionId, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [fileId]
              properties:
                fileId: { type: integer }
                language: { type: string }
                release: { type: string }
                hearingImpaired: { type: boolean }
                forced: { type: boolean }
      responses:
        "201":
          description: Downloaded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExternalSubtitle" }
        "200": { description: Already downloaded }
        "429": { description: The day's download limit is used up (the account's share, or OpenSubtitles') }

  /subtitles/{versionId}/files/{index}:
    delete:
      summary: Remove a downloaded subtitle (owners, or whoever downloaded it)
      parameters:
        - { name: versionId, in: path, required: true, schema: { type: string } }
        - { name: index, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Removed }
        "409": { description: The file is next to the video; Kinara doesn't delete those }

  /subtitles/settings:
    get:
      summary: Subtitle settings (owners only)
      responses:
        "200": { description: "everyone, cleanDvd, username, hasPassword, apiKey (last 4), available" }
    put:
      summary: Change subtitle settings (owners only)
      description: Fields left out keep their values. A changed account is tried at once; account says how that went.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                everyone: { type: boolean, description: Every account can search and download (default on) }
                cleanDvd: { type: boolean, description: Redraw DVD subtitles in Kinara's style (default on) }
                username: { type: string, description: OpenSubtitles account, for more downloads a day ("" removes it) }
                password: { type: string }
                apiKey: { type: string, description: Your own OpenSubtitles API key ("" for Kinara's) }
      responses:
        "200": { description: Saved }

  /subtitles/{versionId}/{index}/pgs:
    get:
      summary: A Blu-ray (PGS) subtitle track as timed pictures, for the app to draw over the video
      description: >
        The first request starts reading the track (just that track is copied out of the file;
        nothing is decoded), so done is false at first. Ask again every couple of seconds with
        from set to the events already had, until done. Times are seconds in the file; x and y
        place each picture in a width x height frame. The token may be given as ?token=.
      parameters:
        - { name: versionId, in: path, required: true, schema: { type: string } }
        - { name: index, in: path, required: true, schema: { type: integer }, description: The subtitle stream index }
        - { name: from, in: query, schema: { type: integer }, description: Events to skip (ones already had) }
      responses:
        "200":
          description: The timeline from `from` on
          content:
            application/json:
              schema:
                type: object
                properties:
                  width: { type: integer }
                  height: { type: integer }
                  done: { type: boolean }
                  total: { type: integer }
                  error: { type: string }
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        start: { type: number }
                        end: { type: number }
                        images:
                          type: array
                          items:
                            type: object
                            properties:
                              n: { type: integer, description: "Picture: .../pgs/{n}.png" }
                              x: { type: integer }
                              y: { type: integer }
                              w: { type: integer }
                              h: { type: integer }
                              forced: { type: boolean }
        "404": { description: No such file or track }
        "422": { description: The track isn't PGS }
        "501": { description: The server has no ffmpeg }

  /subtitles/{versionId}/{index}/pgs/{n}.png:
    get:
      summary: One picture of a PGS track
      parameters:
        - { name: versionId, in: path, required: true, schema: { type: string } }
        - { name: index, in: path, required: true, schema: { type: integer } }
        - { name: n, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: PNG with transparency }
        "404": { description: Not made (yet) }

  /playback/advice:
    get:
      summary: Whether a player should step its quality down
      description: >
        Players ask every few seconds while the server converts for them. "lower" means the
        server can't convert fast enough (or another device has priority): start again at next.
      parameters:
        - { name: version, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Advice
          content:
            application/json:
              schema:
                type: object
                properties:
                  action: { type: string, enum: [ok, lower] }
                  reason: { type: string }
                  next:
                    type: object
                    properties:
                      maxBitrate: { type: integer }
                      maxHeight: { type: integer }

  /playback:
    get:
      summary: What each device is playing now, with its conversion's speed (admin)
      responses:
        "200": { description: List of devices playing }

  /devices:
    get:
      summary: Signed-in devices (admin)
      responses:
        "200":
          description: Devices, most recently seen first
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/DeviceItem" } }

  /devices/{id}:
    delete:
      summary: Sign a device out (admin). It also stops being the priority device.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Signed out }
        "404": { description: No such device }

  /clients/{clientId}:
    put:
      summary: Trust or rename a device (admin)
      parameters:
        - { name: clientId, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                trusted: { type: boolean }
                name: { type: string, description: 1 to 80 characters }
      responses:
        "200":
          description: The device as GET /devices lists it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceItem" }
        "404": { description: No such device }

  /me/device:
    put:
      summary: >-
        The app describes itself (the same object as `device` on sign-in), so
        sessions from before it sent one get its name and details. Apps send it
        when they start. A name the owner gave the device is kept.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string, description: "8 to 64 of A-Z, a-z, 0-9, - and _" }
                name: { type: string }
                platform: { type: string }
                brand: { type: string }
                model: { type: string }
                os: { type: string }
                app: { type: string }
                formFactor: { type: string }
      responses:
        "204": { description: Recorded }
        "400": { description: Missing or unusable id }

  /requests:
    get:
      summary: Requests, newest first. Owners see everyone's; others their own.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, approved, declined, available] } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer } }
      responses:
        "200":
          description: The requests, and how many are pending
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Request" } }
                  pending: { type: integer }
    post:
      summary: Ask for a movie or show that isn't on the server
      description: >
        From a trusted device it is approved straight away (`auto`, `sent`).
        An identical open request is returned with 200 and `duplicate: true`.
        Emits request.created, and request.approved when trusted.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [kind, tmdbId]
              properties:
                kind: { type: string, enum: [movie, show] }
                tmdbId: { type: integer }
                mode: { type: string, enum: [all, seasons, pilot], description: Shows only }
                seasons: { type: array, items: { type: integer }, description: With mode seasons }
                note: { type: string, maxLength: 280 }
      responses:
        "201":
          description: Made. The request, plus `sent`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Request"
                  - type: object
                    properties:
                      sent: { type: boolean }
                      duplicate: { type: boolean }
        "200": { description: An identical open request already exists (duplicate true) }
        "409": { description: Already on the server }

  /requests/{id}/approve:
    post:
      summary: Approve a pending request (admin). Emits request.approved.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: The request }
        "409": { description: Not pending }

  /requests/{id}/decline:
    post:
      summary: Decline a pending or approved request (admin). Emits request.declined.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { reason: { type: string, maxLength: 280 } } }
      responses:
        "200": { description: The request }

  /requests/{id}:
    delete:
      summary: Cancel your own pending request; owners may remove any
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Removed }
        "409": { description: Not pending any more }

  /discover:
    get:
      summary: The Discover page, kept for an hour
      description: >
        Sections in order (empty ones left out): trending, new-movies,
        new-episodes, popular-movies, popular-shows, coming-soon, classics,
        acclaimed-shows. Genres are TMDB's for movies and shows.
      responses:
        "200":
          description: Sections and genres
          content:
            application/json:
              schema:
                type: object
                properties:
                  sections:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        title: { type: string }
                        items: { type: array, items: { $ref: "#/components/schemas/TitleItem" } }
                  genres:
                    type: array
                    items: { type: object, properties: { id: { type: integer }, name: { type: string }, kind: { type: string, enum: [movie, show] } } }
                  updatedAt: { type: integer }

  /discover/{section}:
    get:
      summary: One Discover section, paged (20 a page)
      parameters:
        - { name: section, in: path, required: true, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
      responses:
        "200":
          description: A page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TitlePage" }
        "404": { description: No such section }

  /discover/genre/{kind}/{genreId}:
    get:
      summary: Titles in one genre, paged
      parameters:
        - { name: kind, in: path, required: true, schema: { type: string, enum: [movie, show] } }
        - { name: genreId, in: path, required: true, schema: { type: integer } }
        - { name: sort, in: query, schema: { type: string, enum: [popular, rating, new], default: popular } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
      responses:
        "200":
          description: A page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TitlePage" }

  /search/external:
    get:
      summary: Search TMDB for movies and shows, in the library or not
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
      responses:
        "200":
          description: A page; titles the library has carry `item`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TitlePage" }

  /fs/folders:
    get:
      summary: Folders on the server's disks, for the folder picker (admin)
      description: >
        With no path, lists places to start: drives on Windows; the root, home
        and the usual mount points elsewhere. Hidden and system folders are left
        out. Each folder says which library already has it (or a folder around it).
      parameters:
        - { name: path, in: query, schema: { type: string }, description: Absolute folder to list }
      responses:
        "200":
          description: The folder's subfolders
          content:
            application/json:
              schema:
                type: object
                properties:
                  path: { type: string, description: Empty for the top level }
                  parent: { type: string, description: Empty at a drive or the root }
                  library: { type: string }
                  videos: { type: integer, description: Video files directly in this folder }
                  separator: { type: string }
                  truncated: { type: boolean }
                  folders:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        path: { type: string }
                        library: { type: string }
        "400": { description: Not an absolute path }
        "404": { description: The folder can't be opened }

  /libraries/{id}/scan:
    post:
      summary: Start a scan (admin, or an API key with library:scan)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - name: path
          in: query
          description: Scan only this folder, relative to one of the library's folders (or a full path inside one).
          schema: { type: string }
      responses:
        "202": { description: Started }
        "400": { description: The folder isn't inside the library or doesn't exist }
        "409": { description: A scan is already running }

  /libraries/{id}/rematch:
    post:
      summary: Retry matching for unmatched items, then scan (admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "202": { description: Started }

  /items:
    get:
      summary: Browse items
      parameters:
        - { name: libraryId, in: query, schema: { type: integer } }
        - { name: kind, in: query, schema: { type: string, enum: [movie, show, season, episode] } }
        - { name: parentId, in: query, schema: { type: string } }
        - { name: matchState, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string, enum: [title, added, year, length, rating] } }
        - { name: genre, in: query, schema: { type: string }, description: 'A TMDB genre such as "Comedy"' }
        - { name: watched, in: query, schema: { type: string, enum: [unwatched, started, watched] }, description: "For the current profile. Shows: started = some episodes seen, watched = all" }
        - { name: maxRuntime, in: query, schema: { type: integer }, description: Minutes }
        - { name: quality, in: query, schema: { type: string, enum: [best] }, description: Only titles with a 4K or HDR file }
        - { name: q, in: query, schema: { type: string }, description: Title words }
        - name: collections
          in: query
          schema: { type: string, enum: ["1"] }
          description: |
            Movie listings without q: with the owner's groupCollections setting
            on, a franchise with two or more of the listed movies is one item of
            kind "collection" (id "c" plus TMDB's collection ID, count = its
            movies) in their place. GET /items/{id} for it answers with the
            franchise (item) and its movies (items), oldest first. Also for
            /items/letters.
        - { name: limit, in: query, schema: { type: integer, maximum: 500, default: 100 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Item" }
                  nextOffset: { type: integer, description: Present when more items may follow }

  /items/{id}:
    get:
      summary: Item details
      description: |
        Movies and episodes include their files. Episodes include their season
        and show. Shows include the next episode. A movie in a franchise with two
        or more movies on the server includes collection (id, title, count). For a
        franchise ("c119"): item, and items (its movies, oldest first).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  item: { $ref: "#/components/schemas/Item" }
                  versions:
                    type: array
                    items: { $ref: "#/components/schemas/Version" }
                  season: { $ref: "#/components/schemas/Item" }
                  show: { $ref: "#/components/schemas/Item" }
                  nextUp: { $ref: "#/components/schemas/NextUp" }
                  cast:
                    type: array
                    description: Movies and shows; episodes get their show's cast
                    items: { $ref: "#/components/schemas/CastMember" }
                  trackPrefs: { $ref: "#/components/schemas/TrackPrefs" }

  /items/letters:
    get:
      summary: Where each letter starts in the A to Z list, for a jump bar
      description: Takes the same filters as /items (sort is always title). "#" is titles starting with a digit or symbol.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  letters:
                    type: array
                    items:
                      type: object
                      properties:
                        letter: { type: string }
                        offset: { type: integer }

  /items/{id}/prefs:
    put:
      summary: Save audio and subtitle choices for the show or movie this item belongs to
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TrackPrefs" }
      responses:
        "200":
          description: The merged preferences now in effect
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrackPrefs" }

  /search:
    get:
      summary: Find movies and shows by title
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 40, maximum: 100 } }
      responses:
        "200":
          description: Best matches first
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Item" }

  /profiles:
    get:
      summary: This account's profiles and the one this device is watching as
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  profiles:
                    type: array
                    items: { $ref: "#/components/schemas/Profile" }
                  current: { type: integer }
    post:
      summary: Add a profile (up to 12)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                color: { type: string }
                pin: { type: string, description: 4 digits }
                kids: { type: boolean }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }

  /profiles/{id}:
    patch:
      summary: Change a profile (fields not sent stay as they are; pin "" removes the PIN)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Updated }
        "403": { description: The profile has a PIN and isn't the one selected }
    delete:
      summary: Remove a profile and its history (not the last one)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Removed }

  /profiles/{id}/select:
    post:
      summary: Watch as this profile on this device
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                pin: { type: string }
      responses:
        "200": { description: Selected }
        "403": { description: Wrong PIN }
        "429": { description: Too many wrong PINs }

  /cast/{id}/{ord}:
    get:
      summary: A cast member's photo, resized on request
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: ord, in: path, required: true, schema: { type: integer } }
        - { name: w, in: query, schema: { type: integer } }
        - { name: token, in: query, schema: { type: string } }
      responses:
        "200": { description: Image }
        "404": { description: No photo }

  /items/{id}/children:
    get:
      summary: Seasons of a show, or episodes of a season, in order
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Item" }

  /items/{id}/watched:
    post:
      summary: Mark watched or unwatched (shows and seasons apply to every episode)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                watched: { type: boolean }
      responses:
        "204": { description: Done }

  /items/{id}/match:
    post:
      summary: Fix a match by TMDB ID (admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tmdbId: { type: integer }
      responses:
        "200":
          description: Matched
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }

  /home:
    get:
      summary: Continue Watching and Recently Added
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  continueWatching:
                    type: array
                    items:
                      type: object
                      properties:
                        item: { $ref: "#/components/schemas/Item" }
                        showId: { type: string }
                        showTitle: { type: string }
                        positionSec: { type: number }
                        inProgress: { type: boolean }
                        reason: { type: string }
                  recentlyAdded:
                    type: array
                    items: { $ref: "#/components/schemas/Item" }

  /progress/{id}:
    put:
      summary: Report playback position for a movie or episode
      description: |
        Send every 10 seconds, on pause, and on stop. Past 92% of the file's
        length the item is marked watched. Reports older than the stored one
        (by clientTime) are ignored, so offline reports can be replayed safely.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [positionSec]
              properties:
                positionSec: { type: number }
                versionId: { type: string }
                clientTime: { type: integer, description: Unix seconds when the position was read }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WatchState" }

  /stream/{id}:
    get:
      summary: Direct play a file (supports Range requests)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: Version ID }
        - { name: token, in: query, schema: { type: string } }
      responses:
        "200": { description: The whole file }
        "206": { description: Part of the file }

  /images/{id}/{kind}:
    get:
      summary: Artwork, resized on request
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: kind, in: path, required: true, schema: { type: string, enum: [poster, backdrop, still] } }
        - { name: w, in: query, schema: { type: integer }, description: "Width; rounded up to 160, 240, 320, 400, 640, 960, 1280 or 1920" }
        - { name: token, in: query, schema: { type: string } }
      responses:
        "200": { description: Image }
        "404": { description: No artwork }

  /images/{id}/{kind}/color:
    get:
      summary: The artwork's dominant colour, for tinting the app to match it
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: kind, in: path, required: true, schema: { type: string, enum: [poster, backdrop, still] } }
      responses:
        "200":
          description: '"#rrggbb", or "" when the artwork is mostly grey or missing'
          content:
            application/json:
              schema: { type: object, properties: { color: { type: string } } }

  /transcode/{id}:
    get:
      summary: Convert a file on the fly for players that can't play it as is
      description: |
        A Matroska stream written as ffmpeg produces it. It can't be seeked;
        to jump, request a new stream with a different start. Present on a
        version as transcodeUrl when the server has ffmpeg.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: Version ID }
        - { name: start, in: query, schema: { type: number }, description: Seconds to begin at }
        - { name: video, in: query, required: true, schema: { type: string, enum: [copy, h264] } }
        - { name: maxBitrate, in: query, schema: { type: integer }, description: "kbit/s for re-encoded video (default 8000)" }
        - { name: maxHeight, in: query, schema: { type: integer }, description: "Pixels for re-encoded video (default 1080)" }
        - { name: audio, in: query, schema: { type: integer }, description: Source stream index of the audio track (default the first) }
        - { name: container, in: query, schema: { type: string, enum: [mkv, mp4] }, description: "mkv (default) or mp4: fragmented MP4 for web browsers, without subtitles" }
        - { name: dovi, in: query, schema: { type: string, enum: ["1", "0"] }, description: "Whether the player shows Dolby Vision. 1: copied Dolby Vision goes out as is (tagged dvh1 in MP4/HLS). 0: profile 7 and 8.1 are copied as their HDR10 base layer, profile 5 is converted with libplacebo. Left out: profile 7 into MP4/HLS is stripped to HDR10, otherwise as before." }
        - { name: audioCodec, in: query, required: true, schema: { type: string, enum: [copy, aac] } }
        - { name: token, in: query, schema: { type: string } }
      responses:
        "200": { description: The converted stream }
        "400": { description: Bad options }
        "503": { description: Too many conversions running }

  /speedtest:
    get:
      summary: Random bytes, for the app to measure the connection
      parameters:
        - { name: bytes, in: query, schema: { type: integer }, description: "64 KB to 32 MB" }
      responses:
        "200": { description: Bytes }

  /trickplay/{id}:
    get:
      summary: Preview thumbnails for skipping through a file
      description: |
        Frame n (time n * interval) is on sheet floor(n / (cols * rows)) + 1,
        at column n % cols and row floor(n / cols) % rows. Asking for a file
        without previews moves it to the front of the queue.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: Version ID }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  interval: { type: integer }
                  width: { type: integer }
                  height: { type: integer }
                  cols: { type: integer }
                  rows: { type: integer }
                  count: { type: integer }
                  sheets: { type: integer }
                  sheetUrl: { type: string, description: 'Has "{n}" where the sheet number goes' }
        "404": { description: Not made yet }

  /trickplay/{id}/{sheet}:
    get:
      summary: One sheet of preview thumbnails (JPEG)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: sheet, in: path, required: true, schema: { type: string }, description: 'Like "1.jpg"' }
        - { name: token, in: query, schema: { type: string } }
      responses:
        "200": { description: Image }

  /genres:
    get:
      summary: Genres with available titles, most titles first
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [movie, show] } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  genres:
                    type: array
                    items: { type: object, properties: { name: { type: string }, count: { type: integer } } }

  /trending:
    get:
      summary: What's trending on TMDB this week, marked with what's in the library
      description: |
        Lists of titles (today, movies, shows) from TMDB, refreshed hourly.
        Each has `item` set when it's in the library; `inLibrary` collects
        those. Needs a TMDB key.
      responses:
        "200": { description: OK }
        "501": { description: No TMDB key on the server }
        "502": { description: TMDB couldn't be reached }

  /tmdb/{kind}/{id}:
    get:
      summary: A movie or show from TMDB, whether or not it's in the library
      description: |
        Details, top cast and (for shows) seasons, for a title page opened from
        Trending. `item` is set when the library has it; apps then open the
        library page instead. Cached on the server for 6 hours. Needs a TMDB key.
        `request` (a RequestMarker) is set when someone has an open request for
        it, and `onTheWay` when the owner's tools reported it is on its way.
      parameters:
        - { name: kind, in: path, required: true, schema: { type: string, enum: [movie, show] } }
        - { name: id, in: path, required: true, schema: { type: integer }, description: The TMDB ID }
      responses:
        "200": { description: OK }
        "400": { description: Not movie or show, or a bad ID }
        "404": { description: TMDB has no such title }
        "501": { description: No TMDB key on the server }
        "502": { description: TMDB couldn't be reached }

  /tmdb/show/{id}/season/{n}:
    get:
      summary: A season's episodes from TMDB (titles, dates, stills), for shows outside the library
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer }, description: The show's TMDB ID }
        - { name: n, in: path, required: true, schema: { type: integer }, description: Season number (0 for specials) }
      responses:
        "200": { description: OK }
        "404": { description: TMDB has no such season }
        "501": { description: No TMDB key on the server }

  /tmdb-image/{file}:
    get:
      summary: TMDB artwork for titles not in the library (Trending), resized on request
      parameters:
        - { name: file, in: path, required: true, schema: { type: string }, description: 'Like "abc123.jpg"' }
        - { name: w, in: query, schema: { type: integer } }
        - { name: token, in: query, schema: { type: string } }
      responses:
        "200": { description: Image }

  /auth/accounts:
    get:
      summary: Accounts the sign-in screen can offer, and whether new ones can be made
      security: []
      description: |
        `accounts` is empty when the owner turned the list off. `allowSignup`
        says whether POST /auth/signup is open.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  accounts:
                    type: array
                    items: { type: object, properties: { username: { type: string }, color: { type: string } } }
                  allowSignup: { type: boolean }

  /auth/signup:
    post:
      summary: Make an ordinary account and sign it in (only when the owner allows sign-up)
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, description: "1 to 32 letters, digits, spaces, dots, dashes or underscores" }
                password: { type: string, description: At least 8 characters }
                deviceName: { type: string }
                device: { $ref: "#/components/schemas/DeviceInfo" }
      responses:
        "201": { description: Signed in; same shape as /auth/login }
        "400": { description: Bad name or short password }
        "403": { description: Sign-up is off }
        "409": { description: Name taken }

  /auth/quick/start:
    post:
      summary: Quick Connect - get a code to sign this device in from a phone or the web app
      description: >
        For TVs and other devices where typing a password is a chore. Show the
        code; someone signed in elsewhere enters it (POST /auth/quick/approve)
        and the next poll signs this device in as them. Codes last 10 minutes.
        No Kinara account is involved.
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceName: { type: string }
                device: { $ref: "#/components/schemas/DeviceInfo" }
      responses:
        "200":
          description: The code to show, and the secret to poll with (keep it on this device)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, description: Six digits }
                  secret: { type: string }
                  expiresAt: { type: integer, description: Unix seconds }
                  interval: { type: integer, description: Seconds between polls }
        "429": { description: Too many codes asked for from this address }
        "503": { description: Too many codes waiting on this server }

  /auth/quick/poll:
    post:
      summary: Quick Connect - has the code been approved?
      security: []
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [secret], properties: { secret: { type: string } } }
      responses:
        "200": { description: Approved and signed in; same shape as /auth/login. Works once. }
        "202": { description: Not approved yet }
        "410": { description: The code ran out, was cancelled or was already used; get a new one }

  /auth/quick/cancel:
    post:
      summary: Quick Connect - forget a code this device no longer shows
      security: []
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [secret], properties: { secret: { type: string } } }
      responses:
        "204": { description: Forgotten (or already gone) }

  /auth/quick/{code}:
    get:
      summary: Quick Connect - which device is waiting behind a code
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The waiting device
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string }
                  device: { type: string }
                  expiresAt: { type: integer }
        "404": { description: No such code waiting }
        "429": { description: Too many wrong codes from this account or address }

  /auth/quick/approve:
    post:
      summary: Quick Connect - sign the code's device in as you
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [code], properties: { code: { type: string, description: Spaces are ignored } } }
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema: { type: object, properties: { device: { type: string } } }
        "404": { description: No such code waiting }
        "429": { description: Too many wrong codes from this account or address }

  /setup:
    post:
      summary: First run only - make the owner account and sign it in
      description: >
        Works only while the server has no accounts (health says setupDone false)
        and only from the home network. Afterwards it answers 409.
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, description: "1 to 32 letters, digits, spaces, dots, dashes or underscores" }
                password: { type: string, description: At least 8 characters }
                deviceName: { type: string }
                device: { $ref: "#/components/schemas/DeviceInfo" }
      responses:
        "201": { description: The owner, signed in; same shape as /auth/login }
        "400": { description: Bad name or short password }
        "403": { description: Not from the home network }
        "409": { description: Already set up }

  /lists:
    get:
      summary: This profile's lists ("My List" first, made on first use) with counts
      responses:
        "200": { description: OK }
    post:
      summary: Make a named list
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { name: { type: string } } }
      responses:
        "201": { description: The new list }
        "400": { description: Name must be 1 to 80 characters }

  /lists/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    patch:
      summary: Rename a list
      responses:
        "204": { description: Renamed }
    delete:
      summary: Remove a named list ("My List" can't be removed)
      responses:
        "204": { description: Removed }
        "400": { description: That's My List }

  /lists/{id}/items:
    get:
      summary: The titles on a list, newest first ("default" for My List)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: 'A list ID, or "default"' }
      responses:
        "200": { description: '{"listId": 1, "items": [...]}' }

  /lists/{id}/items/{item}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: 'A list ID, or "default"' }
      - { name: item, in: path, required: true, schema: { type: string }, description: A movie or show }
    put:
      summary: Add a title to a list (again is fine)
      responses:
        "204": { description: Added }
    delete:
      summary: Take a title off a list
      responses:
        "204": { description: Removed }

  /users:
    get:
      summary: Every account (owners only)
      responses:
        "200": { description: OK }
    post:
      summary: Add an account (owners only)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string }
                password: { type: string }
                isAdmin: { type: boolean }
      responses:
        "201": { description: The new account }
        "409": { description: Name taken }

  /users/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    patch:
      summary: Set a new password (signs the account out everywhere) or change owner rights
      responses:
        "204": { description: Saved }
        "409": { description: That would leave the server without an owner }
    delete:
      summary: Remove an account and its history (not your own)
      responses:
        "204": { description: Removed }

  /settings:
    get:
      summary: Server settings (owners only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  listAccounts: { type: boolean, description: Show accounts on the sign-in screen }
                  allowSignup: { type: boolean, description: Let anyone who reaches the server make an account }
                  priorityDevice: { type: string, description: The device that keeps its quality when the server is busy converting }
                  updateCheck: { type: boolean, description: Check the downloads site twice a day for a newer Kinara (default on) }
                  groupCollections: { type: boolean, description: Show a franchise's movies as one card in movie libraries (default on) }
    put:
      summary: Save server settings (owners only)
      description: Fields left out keep their values.
      responses:
        "200": { description: Saved }

  /items/{id}/edit:
    get:
      summary: A title's editable details (owners only)
      description: |
        title, sortTitle, year, overview, rating, airDate, genres; locked (fields
        edited by hand, which matching leaves alone); art (the kinds of artwork
        this title has: poster and backdrop, or still for an episode); images
        (current artwork addresses); canPick (TMDB artwork can be listed).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: OK }

  /items/{id}:
    patch:
      summary: Edit a title by hand (owners only)
      description: Fields left out stay. Every field changed is locked, so matching and refreshing from TMDB leave it as edited. Answers like GET /items/{id}/edit.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                sortTitle: { type: string, description: "Follows the title (without The, A or An) unless given" }
                year: { type: integer }
                overview: { type: string }
                rating: { type: number, description: 0 to 10 }
                airDate: { type: string, description: YYYY-MM-DD }
                genres: { type: array, items: { type: string } }
      responses:
        "200": { description: Saved }
        "400": { description: Empty title, bad year, date or rating }

  /items/{id}/unlock:
    post:
      summary: Give fields back to TMDB (owners only)
      description: 'Unlocks them ({"fields": ["title", "poster"]} or ["all"]) and refreshes the title from TMDB now.'
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Unlocked }

  /items/{id}/artwork/{kind}:
    get:
      summary: TMDB's artwork for a title, best first (owners only)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: kind, in: path, required: true, schema: { type: string, enum: [poster, backdrop, still] } }
      responses:
        "200": { description: "choices: path, url (to show it), width, height, language, votes, current" }
        "409": { description: The title isn't matched to TMDB }

  /items/{id}/images/{kind}:
    put:
      summary: 'Use TMDB artwork: {"path": "/abc.jpg"} from the list (owners only; locks it)'
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: kind, in: path, required: true, schema: { type: string, enum: [poster, backdrop, still] } }
      responses:
        "200": { description: Set }

  /items/{id}/images/{kind}/upload:
    post:
      summary: Upload artwork, a JPEG or PNG up to 20 MB as the body (owners only; locks it)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: kind, in: path, required: true, schema: { type: string, enum: [poster, backdrop, still] } }
      requestBody:
        content:
          image/jpeg: {}
          image/png: {}
      responses:
        "200": { description: Set }
        "400": { description: Not a JPEG or PNG, or too small }

  /items/{id}/download:
    get:
      summary: Download qualities for a title, with expected sizes
      description: |
        For a movie or an episode, or a season or show (all its episodes, or
        only unwatched ones with ?unwatched=1). "original" is the file as it
        is; the others are prepared first as an MP4 any phone plays (H.264
        and stereo AAC), and need ffmpeg on the server ("available").
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: unwatched, in: query, schema: { type: string, enum: ["1"] } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
                  count: { type: integer, description: Movies or episodes covered }
                  default: { type: string, description: The quality to pick unless the person chose one }
                  qualities:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        label: { type: string }
                        maxHeight: { type: integer }
                        maxBitrate: { type: integer, description: kbit/s }
                        estimate: { type: integer, description: Expected bytes for all of them }
                        available: { type: boolean }

  /downloads:
    get:
      summary: This account's downloads on all its devices (?device=this for just this one)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
                  downloads: { type: array, items: { $ref: "#/components/schemas/Download" } }
    post:
      summary: Download a title on this device
      description: |
        A movie or an episode, or every episode of a season or show
        (unwatched ones only with "unwatched"). Asking again for a title
        this device already has replaces its quality. Smaller qualities are
        prepared one at a time in the background; follow them on GET
        /downloads. Watch progress made offline goes back with PUT
        /progress/{id} and clientTime.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [itemId]
              properties:
                itemId: { type: string }
                versionId: { type: string, description: The file (a movie or an episode only) }
                quality: { type: string, enum: [original, high, medium, low], description: Default medium (original without ffmpeg) }
                audio: { type: integer, description: Audio stream index (default the profile's language, else the default track) }
                unwatched: { type: boolean }
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema:
                type: object
                properties:
                  downloads: { type: array, items: { $ref: "#/components/schemas/Download" } }
        "403": { description: Downloads are turned off }
        "409": { description: The account has as many downloads as the owner allows }

  /downloads/all:
    get:
      summary: Everyone's downloads, the room they take and the settings (owners only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings: { $ref: "#/components/schemas/DownloadSettings" }
                  canConvert: { type: boolean }
                  usedBytes: { type: integer }
                  freeBytes: { type: integer }
                  dir: { type: string }
                  downloads: { type: array, items: { $ref: "#/components/schemas/Download" } }

  /downloads/settings:
    put:
      summary: Change the download settings (owners only)
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DownloadSettings" }
      responses:
        "200": { description: Saved }

  /downloads/{id}:
    get:
      summary: A download with what's needed to play it offline
      description: |
        Adds the file's details and markers ("version"), the audio track
        kept ("audio"), and the text subtitles to save as WebVTT
        ("subtitles"). Picture subtitles don't come along.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: OK }
    delete:
      summary: Remove a download (the server removes its copy once nobody wants it)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Removed }

  /downloads/{id}/file:
    get:
      summary: Fetch a ready download (byte ranges; also takes ?token=)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: The file }
        "206": { description: Part of the file }
        "409": { description: Not ready yet, or being prepared again }

  /downloads/{id}/saved:
    post:
      summary: Say this device has all of the file
      description: The server removes its prepared copy a few days after every device that wanted it has it.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Noted }

  /optimize:
    get:
      summary: Optimized versions, by rule, with the room they take (owners only)
      description: |
        A rule asks for a smaller copy (an MP4 with H.264 and stereo AAC) of
        every movie and episode in a library, or of one title, made ahead
        of time in the background. Ready copies are listed as extra versions
        of their title (ID "o" plus a number, "optimized" set to the
        quality), so apps short on bandwidth play them as they are. Titles
        already that small are skipped ("small").
      responses:
        "200": { description: OK }
    post:
      summary: Optimize a library or a title (owners only)
      description: Asking again for the same library or title changes its quality.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                libraryId: { type: integer }
                itemId: { type: string, description: A movie, episode, season or show }
                quality: { type: string, enum: [high, medium, low], description: Default medium }
      responses:
        "201": { description: Added }
        "400": { description: No ffmpeg, a bad quality, or neither or both of libraryId and itemId }

  /optimize/{id}:
    delete:
      summary: Remove a rule (its copies go unless a download still uses them; owners only)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Removed }

  /optimize/{id}/retry:
    post:
      summary: Put a rule's failed copies back in line (owners only)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: How many were put back }

  /items/{id}/optimize:
    get:
      summary: The optimize rule for a title (or its library) and its copies (owners only)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: OK }

  /subtitles/{id}/auto:
    get:
      summary: A file's subtitle files and the automatic search for it
      description: |
        Players ask while playing: it also puts the file at the front of the
        automatic subtitle line. "wanted" lists the languages being looked
        for (state wanted, found or missing), "searching" says the server is
        looking at this file now. Subtitles found are checked against the
        film's speech and served with their timing corrected.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: OK }

  /subtitles/{id}/files/{file}/wrong:
    post:
      summary: Say a downloaded subtitle is wrong
      description: It's never picked for this file again, removed when the server fetched it, and the next one is looked for straight away.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: file, in: path, required: true, schema: { type: integer }, description: The subtitle's index (1000000 and up) }
      responses:
        "200": { description: OK }
        "400": { description: A file next to the video (the owner's own) }

  /subtitles/auto:
    get:
      summary: Automatic subtitles, the services and today's use, and what's missing (owners only)
      responses:
        "200": { description: OK }

  /subtitles/auto/retry:
    post:
      summary: Look again for missing subtitles (all, or one file's with versionId; owners only)
      responses:
        "200": { description: How many were put back in line }

  /backups:
    get:
      summary: Backups, their settings and the next nightly one (owners only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings: { $ref: "#/components/schemas/BackupSettings" }
                  dir: { type: string, description: The backups folder in use }
                  backups: { type: array, items: { $ref: "#/components/schemas/Backup" } }
                  nextAt: { type: integer, description: Unix seconds of the next nightly backup (0 when off) }
                  error: { type: string }
    post:
      summary: Make a backup now (owners only)
      responses:
        "201":
          description: Made
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Backup" }

  /backups/settings:
    put:
      summary: Change the backup settings (owners only)
      description: Fields left out keep their values. A folder is checked for writing first.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BackupSettings" }
      responses:
        "200": { description: Saved }
        "400": { description: Not a full path, not writable, or keep outside 1 to 365 }

  /backups/{name}:
    get:
      summary: Download a backup (owners only; also takes ?token=)
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: The zip file, content: { application/zip: {} } }
    delete:
      summary: Delete a backup (owners only)
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }

  /backups/{name}/restore:
    post:
      summary: Restore a backup from the list (owners only)
      description: |
        Checks the backup, makes a backup of the library as it is now
        (reason before-restore, so this can be undone), then restarts the
        server, which puts the backup in place before opening the database.
        The current files are kept in the data folder's restore-old folder.
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                settings: { type: boolean, description: Also restore the settings file (kinara.env). Off by default. }
      responses:
        "202": { description: Restarting to restore }
        "400": { description: Not a Kinara backup, or made by a newer Kinara }
        "409": { description: A restore is already under way }

  /backups/restore:
    post:
      summary: Restore an uploaded backup (owners only)
      description: The request body is the backup's zip file. ?settings=1 also restores kinara.env. Otherwise as /backups/{name}/restore.
      parameters:
        - { name: settings, in: query, schema: { type: string, enum: ["1"] } }
      requestBody:
        content:
          application/zip: {}
      responses:
        "202": { description: Restarting to restore }
        "400": { description: Not a Kinara backup, or made by a newer Kinara }

  /update:
    get:
      summary: Whether a newer Kinara is out, and any install in progress (owners only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateStatus" }

  /update/check:
    post:
      summary: Check for a newer Kinara now (owners only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateStatus" }

  /update/install:
    post:
      summary: Download and install the newer Kinara (owners only; Windows and macOS installs)
      description: |
        Downloads the installer for this computer, checks its size and
        SHA-256 (and on macOS that Macroboom LLC signed it and Apple
        notarized it), then starts it. On Windows it runs silently (in
        sign-in mode Windows asks for permission on that PC); on a Mac,
        macOS asks for an administrator's password there. The server
        restarts as the new version; the installer is deleted afterwards.
        Follow progress with GET /update.
      responses:
        "202":
          description: Started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateStatus" }
        "409": { description: Nothing to install, or this install is updated another way (apt, docker) }
        "429": { description: Already installing }

  /hls/{id}:
    post:
      summary: Start an HLS conversion of a file (iPhones, iPads, Safari)
      description: |
        Takes the same query as /transcode/{id} (video, audioCodec, audio,
        start, maxBitrate, maxHeight). Answers once the first segment is
        ready. The playlist and its segments are fetched without a token:
        the session ID is the key. A session ends after about 90 s without
        requests, or when stopped.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: Version ID }
      responses:
        "200":
          description: Started
          content:
            application/json:
              schema:
                type: object
                properties:
                  session: { type: string }
                  playlist: { type: string, description: 'Like "/api/v1/hls/session/<session>/index.m3u8"' }
                  start: { type: number, description: Seconds into the file the stream begins at }
        "503": { description: Converting as many streams as it can }

  /hls/session/{session}/{file}:
    get:
      summary: An HLS session's playlist (index.m3u8) or segment (init.mp4, segNNNNN.m4s)
      security: []
      parameters:
        - { name: session, in: path, required: true, schema: { type: string } }
        - { name: file, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: The file }
        "404": { description: The session ended }

  /hls/session/{session}:
    delete:
      summary: Stop an HLS session and delete its files
      parameters:
        - { name: session, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Stopped }

  /libraries/{id}/problems:
    get:
      summary: Files that couldn't be read or placed, and titles that didn't match (owners only)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: '{"unreadable": [...], "unplaced": [...], "unmatched": [...]}' }

  /status:
    get:
      summary: How the server is set up (owners only)
      description: Version, warnings, whether metadata, converting and HLS are on, what ffmpeg can do, and what the background worker is doing.
      responses:
        "200": { description: OK }
    post:
      summary: Report on a title on its way (an API key with status:write, or an owner)
      description: >
        The Kinara format, the same as an incoming hook: tmdbId (with kind),
        tvdbId, imdbId, or title and year; season, episode; state (queued,
        in_progress, done, failed) or progress (0 to 1 or 0 to 100); message;
        eta (seconds); id (your own reference). "done" clears the status and
        scans the title's library.
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        "202": { description: 'Matched: {"matched": {"kind", "title", "year", "tmdbId"}, "state", "id"}' }
        "200": { description: 'No title matched yet; the status is kept: {"matched": null, "kept": true}' }
        "400": { description: Unreadable, or nothing identifies the title }
        "429": { description: 'More than 2 a second for one title or 60 a minute for one sender; see Retry-After' }

  # --- Integrations ---
  # API keys: "Authorization: Bearer kn_live_..." works only on the endpoints
  # that say so, within the key's scopes (library:read, library:scan,
  # status:write, activity:read, webhooks:manage). "local" keys only work
  # from the home network, never through remote access.

  /integrations/events:
    get:
      summary: Every webhook event and API key scope (owners)
      responses:
        "200": { description: '{"items": [{"id", "group", "label", "description", "soon"?}], "scopes": [{"id", "label", "description"}]}' }

  /integrations/webhooks:
    get:
      summary: Outgoing webhooks (owners, or webhooks:manage)
      responses:
        "200": { description: '{"items": [Webhook]}. Webhook: {id, name, url, enabled, secret, events[], libraries: "all"|number[], accounts: "all"|number[], headers: [{name, value}], retries (0..8), timeoutSec (5..30), includePaths, health: {state: ok|failing|never|paused, lastAt?, lastStatus, lastError?}, createdAt}' }
    post:
      summary: Add a webhook (a secret is made when none is sent)
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        "201": { description: The webhook }
        "400": { description: What's wrong with it }

  /integrations/webhooks/{id}:
    put:
      summary: Change a webhook (fields left out keep their value)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: The webhook }
    delete:
      summary: Remove a webhook with its queue and log
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Removed }

  /integrations/webhooks/{id}/test:
    post:
      summary: Send a "test" event now; answers with the delivery
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: 'Delivery: {id, deliveryId, at, event, status (number|null), ms, attempt, error?, request, response? (first 4 KB)}' }

  /integrations/webhooks/{id}/secret:
    post:
      summary: Make a new secret; the old one stops working
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: '{"secret": "whsec_..."}' }

  /integrations/webhooks/{id}/deliveries:
    get:
      summary: Recent tries, newest first (kept 7 days)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        "200": { description: '{"items": [Delivery]}' }

  /integrations/webhooks/{id}/deliveries/{delivery}/redeliver:
    post:
      summary: Send a logged delivery again now, with a new delivery ID; answers with the result
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: delivery, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: The new Delivery }

  /integrations/incoming:
    get:
      summary: Incoming hooks (owners, or webhooks:manage)
      responses:
        "200": { description: '{"items": [Hook]}. Hook: {id, name, token, path, enabled, format: kinara|custom, mapping: {field: path}, stateMap: [{from, to}], progressScale: auto|fraction|percent, onDone: scan|nothing, expireHours, visibility: owners|everyone, lastReceivedAt, createdAt}' }
    post:
      summary: Add an incoming hook (a token is made)
      responses:
        "201": { description: The hook }

  /integrations/incoming/{id}:
    put:
      summary: Change an incoming hook (fields left out keep their value)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: The hook }
    delete:
      summary: Remove a hook, its log and the statuses it reported
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Removed }

  /integrations/incoming/{id}/token:
    post:
      summary: Give a hook a new address; the old one stops working
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: The hook }

  /integrations/incoming/{id}/received:
    get:
      summary: What the hook was sent, newest first (last 200 kept)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        "200": { description: '{"items": [{id, at, ok, summary, body}]}' }

  /hooks/in/{token}:
    post:
      summary: Receive an update at an incoming hook's address (no sign-in; the address is the secret)
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "202": { description: Matched a title }
        "200": { description: No title matched yet; kept }
        "400": { description: Unreadable, or nothing identifies the title }
        "403": { description: The hook is turned off }
        "404": { description: No such hook }
        "429": { description: Too many updates; see Retry-After }

  /ontheway:
    get:
      summary: Titles on their way that the asker may see (owners see all)
      responses:
        "200": { description: '{"items": [{id, kind, tmdbId, title, year?, season?, episode?, state, progress?, message?, etaSec?, updatedAt, source, item?: {id}}]}' }

  /ontheway/{id}:
    delete:
      summary: Clear a status (owners, or webhooks:manage)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Cleared }

  /integrations/keys:
    get:
      summary: API keys (owners)
      responses:
        "200": { description: '{"items": [{id, name, prefix, scopes, network: local|any, createdAt, lastUsedAt?, expiresAt?}]}' }
    post:
      summary: 'Make a key: {name, scopes[], network, expiresDays: 0|30|90|365}. The answer has the whole key ("key") once.'
      responses:
        "201": { description: The key, with "key" }

  /integrations/keys/{id}:
    delete:
      summary: Revoke a key
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Revoked }
  /time:
    get:
      summary: >-
        The server clock in Unix milliseconds, for apps lining their clocks up
        for watch parties. No sign-in needed.
      security: []
      responses:
        "200":
          description: Server time
          content:
            application/json:
              schema: { type: object, properties: { t: { type: number } } }
  /me/device/name:
    put:
      summary: Name this device ("Living Room TV"), shown in watch party invites.
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [name], properties: { name: { type: string, maxLength: 40 } } }
      responses:
        "200": { description: The device and its new name }
  /parties/mine:
    get:
      summary: This device, its watch party (or null) and the parties inviting it.
      responses:
        "200": { description: "{me, party, invites}" }
  /parties/devices:
    get:
      summary: Devices online now that can be invited to a watch party.
      responses:
        "200": { description: "[{device, name, user, label, icon}]" }
  /parties:
    post:
      summary: >-
        Start a watch party around what this device is playing. Playback
        carries on as it was; `invite` lists device IDs to invite at once.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [itemId]
              properties:
                itemId: { type: string }
                title: { type: string }
                position: { type: number, description: Seconds }
                playing: { type: boolean }
                invite: { type: array, items: { type: string } }
      responses:
        "201": { description: The party }
  /parties/join:
    post:
      summary: Join with a 4-letter code, or by id to accept an invite.
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { code: { type: string }, id: { type: string } } }
      responses:
        "200": { description: The party }
        "404": { description: No party has that code }
        "409": { description: The party is full }
        "410": { description: The party has ended }
  /parties/{id}/leave:
    post:
      summary: Leave. The longest-standing member becomes host; an empty party ends.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "204": { description: Left }
  /parties/{id}/decline:
    post:
      summary: Turn down an invite.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "204": { description: Declined }
  /parties/{id}/invite:
    post:
      summary: Invite devices by ID.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { devices: { type: array, items: { type: string } } } }
      responses:
        "200": { description: The party }
  /parties/{id}/control:
    post:
      summary: >-
        Play, pause, seek or load (a new title) for everyone. Starts are
        scheduled a second ahead on the server clock so every device starts
        on the same frame; seeks and loads wait until every device is ready.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [play, pause, seek, load] }
                position: { type: number }
                itemId: { type: string }
                title: { type: string }
                autoplay: { type: boolean }
      responses:
        "200": { description: The party }
  /parties/{id}/report:
    post:
      summary: A member reporting how it's doing; answers with the party.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                itemId: { type: string }
                position: { type: number }
                playing: { type: boolean }
                stalled: { type: boolean }
                ready: { type: boolean }
                driftMs: { type: number }
      responses:
        "200": { description: The party }
  /parties/{id}/wait:
    get:
      summary: >-
        Long-poll: answers when the party's revision passes `rev` (200), after
        25 seconds with nothing new (204), or when the party ended (410).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: rev, in: query, schema: { type: integer } }
      responses:
        "200": { description: The party }
        "204": { description: Nothing new }
        "410": { description: The party ended }
