{{define "login.html"}}{{template "top" .}}
<h1>Sign in</h1>
<form class="card" method="post" action="/login" style="max-width: 420px">
  <p><label for="username">Username</label><input id="username" name="username" autocomplete="username" required autofocus></p>
  <p><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></p>
  <button class="primary">Sign in</button>
</form>
{{template "bottom"}}{{end}}
