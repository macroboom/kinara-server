# Release: push a tag like v0.2.0 (or v0.2.0-rc.1 for a pre-release).
#
#   build      the server, the sidecar and the web app on amd64 and arm64,
#              and a .deb for each (packaging/linux/build.sh)
#   windows    the Windows installer (packaging/windows/build.ps1)
#   macos      the macOS installer, signed and notarized (packaging/macos/build.sh)
#   docker     ghcr.io/macroboom/kinara-server, both architectures
#   apt        the .debs into https://apt.kinara.media (not for pre-releases)
#   downloads  every installer to https://dl.kinara.media, with server/latest/
#              and latest.json for the website (packaging/publish-downloads.sh)
#   release    a GitHub release with every installer attached
#
# Run it by hand (Actions > Release > Run workflow) to build and test
# without publishing anything.
#
# Secrets (Settings > Secrets and variables > Actions), see packaging/linux/README.md:
#   TMDB_KEY          Kinara's TMDB key, built into the server
#   OPENSUBTITLES_KEY Kinara's OpenSubtitles.com API key, built in (optional)
#   SUBDL_KEY         Kinara's SubDL.com API key, built in (optional)
#   WEB_REPO_TOKEN    read access to the private kinara-web repository
#   GPG_PRIVATE_KEY   the APT signing key (armored), and GPG_PASSPHRASE
#   R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET
#   R2_DOWNLOADS_BUCKET   the bucket behind dl.kinara.media (the same R2 token
#                         needs write access to it)
# macOS signing and notarizing (packaging/macos/README.md, "Release workflow"):
#   MACOS_CERTS_P12       both Developer ID certificates with their keys, a .p12
#                         exported from Keychain Access, base64 encoded
#   MACOS_CERTS_PASSWORD  the .p12's password
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD   for notarytool
# (Without them a test run builds the macOS installer unsigned; a release stops.)
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      fail-fast: true
      matrix:
        include:
          # Ubuntu 22.04: the sidecar then runs on glibc 2.35 and newer
          # (Debian 12, Ubuntu 22.04 and later).
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Check out kinara-web (private)
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/kinara-web
          token: ${{ secrets.WEB_REPO_TOKEN }}
          path: kinara-web

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sidecar
          key: ${{ matrix.arch }}
      - uses: oven-sh/setup-bun@v2

      - name: Tools
        run: |
          # Jellyfin's FFmpeg, as the .deb prefers: Ubuntu 22.04's own is 4.4.
          curl -fsSL https://repo.jellyfin.org/jellyfin_team.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/jellyfin.gpg
          printf 'Types: deb\nURIs: https://repo.jellyfin.org/ubuntu\nSuites: jammy\nComponents: main\nSigned-By: /usr/share/keyrings/jellyfin.gpg\n' |
            sudo tee /etc/apt/sources.list.d/jellyfin.sources >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jellyfin-ffmpeg7
          echo /usr/lib/jellyfin-ffmpeg >> "$GITHUB_PATH"
          # nfpm makes the .deb.
          nfpm=2.47.0
          case "$(uname -m)" in x86_64) a=x86_64 ;; aarch64) a=arm64 ;; esac
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v$nfpm/nfpm_${nfpm}_Linux_$a.tar.gz" |
            sudo tar -xz -C /usr/local/bin nfpm
          nfpm --version

      - name: Test
        run: |
          go vet ./...
          go test ./...

      - name: Build
        env:
          KINARA_TMDB_KEY: ${{ secrets.TMDB_KEY }}
          KINARA_OPENSUBTITLES_KEY: ${{ secrets.OPENSUBTITLES_KEY }}
          KINARA_SUBDL_KEY: ${{ secrets.SUBDL_KEY }}
          WEB_REPO: ${{ github.workspace }}/kinara-web
        run: |
          if [ "$PUBLISH" = true ]; then export VERSION="${GITHUB_REF_NAME#v}"; fi
          bash packaging/linux/build.sh

      - name: Check the .deb
        run: |
          deb=$(ls out/*.deb)
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"
          sudo apt-get install -y "./$deb"
          systemctl status kinara-server --no-pager || true
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8420/api/v1/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8420/api/v1/health
          sudo journalctl -u kinara-server --no-pager | tail -n 20
          sudo apt-get remove -y kinara-server

      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/linux_${{ matrix.arch }}/
            out/*.deb
            out/*.sha256
          if-no-files-found: error
      # The web app and the entrypoint are the same for both: upload once.
      - if: matrix.arch == 'amd64'
        uses: actions/upload-artifact@v7
        with:
          name: linux-common
          path: |
            dist/web/
            dist/docker-entrypoint.sh
          if-no-files-found: error

  windows:
    name: Build (Windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      # Inside the checkout, at kinara-web: build.ps1 gets it as ..\..\kinara-web.
      - name: Check out kinara-web (private)
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/kinara-web
          token: ${{ secrets.WEB_REPO_TOKEN }}
          path: kinara-web

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sidecar
          key: windows
      - uses: oven-sh/setup-bun@v2

      - name: Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Test
        run: go test ./...

      - name: Build
        env:
          KINARA_TMDB_KEY: ${{ secrets.TMDB_KEY }}
          KINARA_OPENSUBTITLES_KEY: ${{ secrets.OPENSUBTITLES_KEY }}
          KINARA_SUBDL_KEY: ${{ secrets.SUBDL_KEY }}
        run: |
          $version = if ($env:PUBLISH -eq 'true') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '' }
          ./packaging/windows/build.ps1 -Version $version -WebRepo '..\..\kinara-web'

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            packaging/windows/out/*.exe
            packaging/windows/out/*.sha256
          if-no-files-found: error

  macos:
    name: Build (macOS)
    # Apple silicon; build.sh makes universal binaries for Intel Macs too.
    runs-on: macos-15
    env:
      MACOS_CERTS_P12: ${{ secrets.MACOS_CERTS_P12 }}
    steps:
      - uses: actions/checkout@v7

      - name: Check out kinara-web (private)
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/kinara-web
          token: ${{ secrets.WEB_REPO_TOKEN }}
          path: kinara-web

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sidecar
          key: macos
      - uses: oven-sh/setup-bun@v2

      # A keychain of its own for this run, with both Developer ID
      # certificates and the notarytool login, deleted at the end.
      - name: Signing keychain
        if: env.MACOS_CERTS_P12 != ''
        env:
          MACOS_CERTS_PASSWORD: ${{ secrets.MACOS_CERTS_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/kinara.keychain-db"
          pass="$(openssl rand -hex 24)"
          security create-keychain -p "$pass" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$pass" "$kc"
          echo "$MACOS_CERTS_P12" | base64 --decode > "$RUNNER_TEMP/certs.p12"
          security import "$RUNNER_TEMP/certs.p12" -P "$MACOS_CERTS_PASSWORD" -A -f pkcs12 -k "$kc"
          rm -f "$RUNNER_TEMP/certs.p12"
          # codesign and productbuild may use the keys without asking.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pass" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$kc"
          security find-identity -v | grep "Developer ID"
          xcrun notarytool store-credentials kinara-notary --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --keychain "$kc"

      - name: Build
        env:
          KINARA_TMDB_KEY: ${{ secrets.TMDB_KEY }}
          KINARA_OPENSUBTITLES_KEY: ${{ secrets.OPENSUBTITLES_KEY }}
          KINARA_SUBDL_KEY: ${{ secrets.SUBDL_KEY }}
          WEB_REPO: ${{ github.workspace }}/kinara-web
        run: |
          if [ "$PUBLISH" = true ]; then export VERSION="${GITHUB_REF_NAME#v}"; fi
          if [ -z "$MACOS_CERTS_P12" ]; then
            # Every other Mac refuses an unsigned package: a release needs the
            # secrets; a test run (Run workflow) builds one anyway.
            if [ "$PUBLISH" = true ]; then
              echo "::error::No MACOS_CERTS_P12 secret: a release's macOS installer must be signed"
              exit 1
            fi
            echo "::warning::No MACOS_CERTS_P12 secret: building unsigned"
            export UNSIGNED=1
          fi
          bash packaging/macos/build.sh

      - name: Remove the keychain
        if: always() && env.MACOS_CERTS_P12 != ''
        run: security delete-keychain "$RUNNER_TEMP/kinara.keychain-db" || true

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: |
            out/*.pkg
            out/*.sha256
          if-no-files-found: error

  docker:
    name: Docker image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: linux-*64
          merge-multiple: true
      # Uploaded from inside dist/, so it goes back there.
      - uses: actions/download-artifact@v8
        with:
          name: linux-common
          path: dist
      - name: Build context
        run: ls -R dist | head -n 30 && test -f dist/web/index.html && test -f dist/docker-entrypoint.sh
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - id: meta
        uses: docker/metadata-action@v6
        env:
          # GHCR shows a multi-arch image's description from the index.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/${{ github.repository_owner }}/kinara-server
          labels: |
            org.opencontainers.image.title=Kinara server
            org.opencontainers.image.description=Kinara media server for your movies and shows
            org.opencontainers.image.url=https://kinara.media
          annotations: |
            org.opencontainers.image.title=Kinara server
            org.opencontainers.image.description=Kinara media server for your movies and shows
            org.opencontainers.image.url=https://kinara.media
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
          flavor: |
            latest=auto
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: dist
          file: packaging/linux/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  apt:
    name: APT repository
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: linux-*64
          merge-multiple: true
      - id: gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends apt-utils
      - name: Publish
        env:
          GPG_KEY_ID: ${{ steps.gpg.outputs.fingerprint }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: bash packaging/linux/apt/publish.sh out/*.deb

  downloads:
    name: Downloads (dl.kinara.media)
    needs: [build, windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: linux-*64
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: windows
          path: out
      - uses: actions/download-artifact@v8
        with:
          name: macos
          path: out
      - name: Publish
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_DOWNLOADS_BUCKET: ${{ secrets.R2_DOWNLOADS_BUCKET }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          ls -l out
          bash packaging/publish-downloads.sh "$GITHUB_REF_NAME" out/*.exe out/*.pkg out/*.deb

  release:
    name: GitHub release
    needs: [build, windows, macos, docker]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: linux-*64
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: windows
          path: out
      - uses: actions/download-artifact@v8
        with:
          name: macos
          path: out
      - uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            out/*.deb
            out/*.exe
            out/*.pkg
            out/*.sha256