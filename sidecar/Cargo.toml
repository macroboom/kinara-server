[workspace]
resolver = "2"
members = [
    "crates/kinara-tunnel",
    "crates/kinara-iroh",
    "crates/kinara-connect",
    "crates/kinara-testserver",
    "crates/kinara-e2e",
    "crates/kinara-tunnel-ffi",
]
# Patched copies of other crates (see [patch.crates-io] at the bottom): used
# in their place, never built or tested as part of this workspace.
exclude = ["patches"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
kinara-tunnel = { path = "crates/kinara-tunnel" }
kinara-testserver = { path = "crates/kinara-testserver" }

# iroh is pinned exactly: its API moves between minor releases and we use the
# unstable net report types, which are outside semver.
iroh = { version = "=1.3.0", features = ["unstable-net-report"] }
iroh-tickets = "=1.0.0"
iroh-mdns-address-lookup = "=0.6.0"

anyhow = "1"
bytes = "1"
clap = { version = "4.5", features = ["derive", "env"] }
futures-util = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Patched crates for Apple devices. Drop each once a release fixes it.
#
# netdev 0.46.3 (via iroh's netwatch) doesn't build for iPhone: it uses
# libc's in6_ifreq, which libc only defines for macOS. patches/netdev is
# 0.46.3 with that struct defined in netdev itself
# (src/os/darwin/ipv6_addr_flags.rs, "Kinara patch").
#
# Apple TV: crates that pick their Apple code with target_os = "ios" build
# with no platform code on tvOS. patches/add-tvos.py copies such a crate
# here with tvOS added next to iOS, and adds its line below (netdev has
# both changes). See each copy's KINARA_PATCH.md.
[patch.crates-io]
netdev = { path = "patches/netdev" }
