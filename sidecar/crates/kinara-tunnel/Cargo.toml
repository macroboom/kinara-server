[package]
name = "kinara-tunnel"
description = "Kinara remote access tunnel over iroh: protocol, server end, client end, config"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = ["cli", "mdns"]
# clap argument structs shared by the binaries. The mobile FFI crate turns it off.
cli = ["dep:clap"]
# Local network discovery so devices at home find the server without a relay.
mdns = ["dep:iroh-mdns-address-lookup"]

[dependencies]
anyhow.workspace = true
clap = { workspace = true, optional = true }
iroh.workspace = true
iroh-mdns-address-lookup = { workspace = true, optional = true }
iroh-tickets.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
